<div class="dashboard-container">
  <!-- Barra Lateral -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-header">
        <span>Gastos</span>
      </div>

      <nav class="nav-menu">
        <button class="nav-item active">Inicio</button>
      </nav>
    </div>

    <button class="logout-button" (click)="logout()">Salir</button>
  </aside>

  <!-- Panel Principal -->
  <main class="main-panel">
    <!-- Contenedor blanco superior con el título y subtítulo integrados -->
    <header class="top-white-container">
      <h2>Bienvenido Usuario</h2>
      <p class="subtitle">Gestiona tus gastos de forma simple</p>
    </header>

    <!-- Contenido central con la tarjeta -->
    <section class="content">
      <div class="card">
        <h3>Panel de Control</h3>
        <p>
          Tu espacio personal para gestionar y monitorear todos tus gastos. Comienza
          registrando tus primeros movimientos.
        </p>
        <button type="button">Listo para usar</button>
      </div>
    </section>
  </main>
</div>
