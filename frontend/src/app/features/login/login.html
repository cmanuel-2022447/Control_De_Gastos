<div class="login-container">
  <div class="login-box">
    <div class="login-header">
      <div class="money-icon">
        <span class="money-emoji">💰</span>
      </div>
      <h1>Control de Gastos</h1>
      <div class="login-subtitle">Gestiona tus gastos de forma fácil</div>
    </div>

    <div class="form-panel">
      <form (ngSubmit)="login()">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input 
            type="email" 
            id="email" 
            [(ngModel)]="email" 
            name="email" 
            placeholder="admin@kinal.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            [(ngModel)]="password" 
            name="password" 
            placeholder="********"
            required
          />
        </div>

        <button type="submit" class="btn-login">Iniciar Sesión</button>
      </form>

      <div *ngIf="error" class="error-message">{{ error }}</div>
    </div>

    <div class="test-users-card">
      <p>Usuarios de prueba:</p>
      <div class="test-user-item">
        <span class="badge admin">Admin</span>
        <span>admin@kinal.com / Admin123</span>
      </div>
      <div class="test-user-item">
        <span class="badge user">Usuario</span>
        <span>usuario@kinal.com / Usuario123</span>
      </div>
    </div>
  </div>
</div>
